# Azure Pipelines CI/CD 전체 구성

trigger:
  - main  # main 브랜치에 코드가 푸시되면 자동으로 파이프라인 실행


stages:
  # =================================================================
  # 1. 빌드 단계 (CI - 지속적 통합)
  # 소스 코드를 컴파일하고 테스트하여 배포 가능한 파일(.jar)을 생성합니다.
  # =================================================================
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildJob
        displayName: 'Gradle Build'
        steps:
          # Gradle 태스크를 사용하여 'clean build'를 실행합니다.
          - task: Gradle@3
            displayName: 'Run Gradle clean build'
            inputs:
              workingDirectory: ''
              gradleWrapperFile: 'gradlew'
              tasks: 'clean build'
              publishJUnitResults: true
              testResultsFiles: '**/TEST-*.xml'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.17'
            env:
              SPRING__DATASOURCE__URL: $(SPRING__DATASOURCE__URL)
              SPRING__DATASOURCE__USERNAME: $(SPRING__DATASOURCE__USERNAME)
              SPRING__DATASOURCE__PASSWORD: $(SPRING__DATASOURCE__PASSWORD)
              SPRING__DATASOURCE__DRIVER_CLASS_NAME: $(SPRING__DATASOURCE__DRIVER_CLASS_NAME)
              JWT__SECRET: $(JWT__SECRET)
              JWT__ACCESS_TOKEN_EXPIRATION_MINUTES: $(JWT__ACCESS_TOKEN_EXPIRATION_MINUTES)
              SPRING__CLOUD__AZURE__STORAGE__BLOB__CONNECTION_STRING: $(SPRING__CLOUD__AZURE__STORAGE__BLOB__CONNECTION_STRING)
              SPRING__CLOUD__AZURE__STORAGE__BLOB__CONTAINER_NAME: $(SPRING__CLOUD__AZURE__STORAGE__BLOB__CONTAINER_NAME)
              SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__GOOGLE__CLIENT_ID: $(SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__GOOGLE__CLIENT_ID)
              SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__GOOGLE__CLIENT_SECRET: $(SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__GOOGLE__CLIENT_SECRET)
              SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__GOOGLE__SCOPE: $(SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__GOOGLE__SCOPE)
              SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__KAKAO__CLIENT_ID: $(SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__KAKAO__CLIENT_ID)
              SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__KAKAO__CLIENT_AUTHENTICATION_METHOD: $(SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__KAKAO__CLIENT_AUTHENTICATION_METHOD)
              SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__KAKAO__AUTHORIZATION_GRANT_TYPE: $(SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__KAKAO__AUTHORIZATION_GRANT_TYPE)
              SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__KAKAO__REDIRECT_URI: $(SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__KAKAO__REDIRECT_URI)
              SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__KAKAO__SCOPE: $(SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__KAKAO__SCOPE)
              SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__KAKAO__CLIENT_NAME: $(SPRING__SECURITY__OAUTH2__CLIENT__REGISTRATION__KAKAO__CLIENT_NAME)
              SPRING__SECURITY__OAUTH2__CLIENT__PROVIDER__KAKAO__AUTHORIZATION_URI: $(SPRING__SECURITY__OAUTH2__CLIENT__PROVIDER__KAKAO__AUTHORIZATION_URI)
              SPRING__SECURITY__OAUTH2__CLIENT__PROVIDER__KAKAO__TOKEN_URI: $(SPRING__SECURITY__OAUTH2__CLIENT__PROVIDER__KAKAO__TOKEN_URI)
              SPRING__SECURITY__OAUTH2__CLIENT__PROVIDER__KAKAO__USER_INFO_URI: $(SPRING__SECURITY__OAUTH2__CLIENT__PROVIDER__KAKAO__USER_INFO_URI)
              SPRING__SECURITY__OAUTH2__CLIENT__PROVIDER__KAKAO__USER_NAME_ATTRIBUTE: $(SPRING__SECURITY__OAUTH2__CLIENT__PROVIDER__KAKAO__USER_NAME_ATTRIBUTE)

          # 빌드 결과물(.jar 파일)을 'drop'이라는 이름의 아티팩트로 게시합니다.
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifact'
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)/build/libs'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  # =================================================================
  # 2. 배포 단계 (CD - 지속적 배포)
  # 빌드 단계에서 생성된 .jar 파일을 Azure App Service에 배포합니다.
  # =================================================================
  - stage: Deploy
    displayName: 'Deploy to App Service'
    dependsOn: Build # Build 단계가 성공해야만 실행됩니다.
    condition: succeeded()
    jobs:
      - job: DeployJob
        displayName: 'Deploy to Azure'
        steps:
          # 빌드 단계에서 게시한 'drop' 아티팩트를 다운로드합니다.
          - task: DownloadBuildArtifacts@0
            displayName: 'Download Artifact'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'drop'
              downloadPath: '$(System.ArtifactsDirectory)'

          # 다운로드한 .jar 파일을 Azure App Service에 배포합니다.
          - task: AzureWebApp@1
            displayName: 'Deploy to Azure App Service'
            inputs:
              azureSubscription: '<Your Azure Subscription Connection Name>' # 예: 'My Azure Subscription'
              appType: 'webAppLinux' # 또는 'webApp' (Windows)
              appName: '<Your App Service Name>' # 예: 'balance-game-app'
              package: '$(System.ArtifactsDirectory)/drop/**/*.jar'
              runtimeStack: 'JAVA|17' # App Service의 Java 버전과 일치
